<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Verificações do avatar</title><style>body{font:15px/1.6 system-ui;background:#f5f0e6;padding:30px;color:#292720}iframe{position:absolute;left:-15000px;width:1280px;height:900px}.fail{color:#c22}</style><h1>Verificações do avatar</h1><p id="status">Executando…</p><ol id="results"></ol><iframe title="Avatar sob teste"></iframe><script>
(async()=>{
const frame=document.querySelector('iframe'),list=document.querySelector('#results');let pass=0,fail=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(ok,label)=>{const li=document.createElement('li');li.textContent=(ok?'PASS — ':'FAIL — ')+label;if(ok)pass++;else{fail++;li.className='fail';}list.append(li);};
const mock=`<script>window.audioStats={spoken:0,canceled:0,started:0,aborted:0};Object.defineProperty(window,'speechSynthesis',{value:{getVoices:()=>[],speak(u){window.lastUtterance=u;audioStats.spoken++;u.onstart?.();},cancel(){audioStats.canceled++;}}});window.SpeechSynthesisUtterance=class{constructor(t){this.text=t;}};window.SpeechRecognition=class{constructor(){window.lastRecognition=this;}start(){audioStats.started++;this.onstart?.();}abort(){audioStats.aborted++;this.onend?.();}};<\/script>`;
const source=await(await fetch('../v3.html')).text();
const load=(extra='')=>new Promise(r=>{frame.onload=r;frame.srcdoc=source.replace('<head>','<head><base href="'+new URL('../',location.href)+'">'+mock+extra);});
const saved=sessionStorage.getItem('portfolio-mode');sessionStorage.setItem('portfolio-mode','3d');
try{
await load();await wait(1200);let w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id);
assert(!!w.__avatar,'Controlador inicializa');assert(w.__avatar.ready,'Malha WebGL carrega com recursos locais');await wait(300);assert(w.__avatar.rendererIdle,'Renderizador para quando o avatar está em repouso');
$('avatarLaunch').click();await wait(60);assert($('avatarDialog').open&&d.activeElement.id==='avatarClose','Diálogo abre com foco no controle de fechar');assert($('avatarPortrait').parentElement.id==='avatarSeat','O mesmo avatar vai para o centro');assert(w.__scene.idle,'Cena da mesa pausa durante a conversa');assert(w.audioStats.spoken===0&&w.audioStats.started===0,'Abrir não ativa áudio nem microfone');
$('avatarInput').value='Quanto custa um site?';$('avatarForm').dispatchEvent(new w.Event('submit',{cancelable:true}));await wait(600);assert($('avatarMessages').textContent.includes('depende do escopo'),'Resposta de orçamento não inventa valor');assert(!$('avatarSend').disabled,'Envio reativa após resposta');
$('avatarInput').value='<img src=x onerror=alert(1)>'; $('avatarForm').dispatchEvent(new w.Event('submit',{cancelable:true}));await wait(600);assert(!$('avatarMessages').querySelector('img')&&$('avatarMessages').textContent.includes('<img'),'Mensagem é texto, sem execução de HTML');
$('avatarVoice').click();$('avatarInput').value='O que você faz?';$('avatarForm').dispatchEvent(new w.Event('submit',{cancelable:true}));await wait(600);assert(w.audioStats.spoken===1,'Voz opt-in lê a resposta (mock)');$('avatarVoice').click();assert(w.audioStats.canceled===1,'Desligar voz cancela a fala');
$('avatarMic').click();assert(!$('avatarMicConsent').hidden&&w.audioStats.started===0,'Microfone exige ação explícita após explicar a transcrição');$('avatarMicConfirm').click();assert(w.audioStats.started===1&&$('avatarMic').getAttribute('aria-pressed')==='true','Reconhecimento entra em escuta (mock)');w.lastRecognition.onresult({results:[[{transcript:'Minha ideia é um portfólio'}]]});assert($('avatarInput').value==='Minha ideia é um portfólio','Transcrição entra no campo para revisão');assert(!$('avatarMessages').textContent.includes('Minha ideia é um portfólio'),'Fala não é enviada automaticamente');
$('avatarClose').click();await wait(50);assert(!$('avatarDialog').open&&d.activeElement.id==='avatarLaunch','Fechar restaura avatar e foco');assert(w.audioStats.aborted===1,'Fechar encerra o microfone');assert(d.documentElement.style.overflow!=='hidden','Scroll é restaurado');
$('avatarLaunch').dispatchEvent(new w.MouseEvent('click',{detail:1,bubbles:true}));await wait(50);$('avatarClose').dispatchEvent(new w.MouseEvent('click',{detail:1,bubbles:true}));await wait(650);assert(w.__avatar.phase==='closed'&&$('avatarPortrait').parentElement.id==='avatarHome','Fechar durante a abertura termina sem prender o avatar');
$('avatarLaunch').click();await wait(30);$('avatarInput').value='projetos';$('avatarForm').dispatchEvent(new w.Event('submit',{cancelable:true}));$('avatarClose').click();await wait(650);assert(!$('avatarMessages').querySelector('.thinking'),'Fechar durante resposta limpa o estado pendente');$('avatarLaunch').click();await wait(30);assert($('avatarMessages').textContent.includes('conceitos ilustrativos'),'Resposta concluída permanece ao reabrir');$('avatarReset').click();assert($('avatarMessages').children.length===1,'Recomeçar limpa a conversa');
$('avatarClose').click();await wait(30);frame.style.width='390px';frame.style.height='844px';await wait(100);$('avatarLaunch').click();await wait(50);assert(d.documentElement.scrollWidth===390,'Mobile sem overflow horizontal');const form=$('avatarForm').getBoundingClientRect();assert(form.bottom<=844&&form.left>=0&&form.right<=390,'Campo de conversa cabe no mobile');const box=$('avatarMessages').getBoundingClientRect();assert(box.height>70,'Histórico mantém espaço de leitura no mobile');
const cases=[['Olá!','hello'],['Me mostra os projetos','projects'],['Me conta sobre TORRA','project'],['Quero criar um site','website'],['O que você ensina?','teach'],['Como você usa IA?','ai'],['Qual o preço?','price'],['Quero falar com o Lucas','contact'],['Me conta sua história','story'],['Quem é você?','demo'],['quantos planetas existem','fallback']];for(const[q,intent]of cases)assert(w.PortfolioDemo.respond(q).intent===intent,'Intenção: '+q);

$('avatarClose').click();await wait(40);
await load('<script>const originalMedia=window.matchMedia.bind(window);window.matchMedia=q=>q.includes("prefers-reduced-motion")?{matches:true,addEventListener(){},removeEventListener(){}}:originalMedia(q);<\/script>');await wait(1200);w=frame.contentWindow;d=frame.contentDocument;
$('avatarLaunch').dispatchEvent(new w.MouseEvent('click',{detail:1,bubbles:true}));await wait(40);assert(w.__avatar.phase==='open'&&!$('avatarPortrait').getAnimations().length,'Reduced motion abre sem deslocamento animado');
d.dispatchEvent(new w.PointerEvent('pointermove',{pointerType:'mouse',clientX:300,clientY:200,bubbles:true}));await wait(200);assert(w.__avatar.rendererIdle,'Reduced motion mantém avatar estático');
$('avatarDialog').dispatchEvent(new w.Event('cancel',{cancelable:true}));await wait(40);assert(!$('avatarDialog').open&&d.activeElement.id==='avatarLaunch','Escape restaura o foco sem animação');
await load('<script>const getContext=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){return /webgl/i.test(type)?null:getContext.call(this,type,...args);};<\/script>');await wait(1200);w=frame.contentWindow;d=frame.contentDocument;
assert(!w.__avatar.ready&&!$('avatarPortrait').classList.contains('ready'),'Sem WebGL, preserva o fallback 2D');const pixel=$('avatarFallback').getContext('2d').getImageData(256,256,1,1).data;assert(pixel[3]>200,'Fallback contém retrato visível');$('avatarLaunch').click();await wait(50);assert($('avatarMessages').textContent.includes('versão digital'),'Chat funciona mesmo sem WebGL');
}catch(e){assert(false,e.stack||String(e));}finally{if(saved===null)sessionStorage.removeItem('portfolio-mode');else sessionStorage.setItem('portfolio-mode',saved);document.querySelector('#status').textContent=`${pass} verificações passaram; ${fail} falharam.`;document.title=fail?'FAIL — Avatar':'PASS — Avatar';}
})();
</script></html>
